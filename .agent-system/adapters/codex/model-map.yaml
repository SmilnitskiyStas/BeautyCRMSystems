# Codex CLI model map — tier -> concrete model + reasoning effort.
# The ONLY place a Codex model name appears.
# Verified 2026-11-20 against codex-cli 0.171.0 (~/.codex/models_cache.json) by real `codex exec` runs
# with a ChatGPT account (each model answered):
#   gpt-6-luna    "Fast and affordable model for easier tasks."
#   gpt-6.2-sol   "Fast, go-to model for coding and everyday work."
#   gpt-6.2-astra "Our most capable model for complex coding and professional work."
# Not mapped: gpt-6.1-terra (visual / computer use), gpt-6.1-sol and gpt-6-astra ("previous generation"),
# gpt-6-sol and gpt-5.6-* ("legacy"). codex-cli 0.154.0 rejects all of these with model_not_found —
# the CLI must be >= 0.171.0 (`codex update`).
# Reasoning effort accepted: low | medium | high | xhigh | max (| ultra on sol/astra/terra).
#
# Codex model names change roughly per release — re-verify on upgrade;
# `node scripts/doctor.mjs` flags a missing tier.

tiers:
  cheap: gpt-6-luna
  standard: gpt-6.2-sol
  reasoning: gpt-6.2-sol
  frontier: gpt-6.2-astra

# frontier starts at medium: xhigh drains plan limits within minutes. Climb sol medium -> sol high ->
# astra medium -> astra high one step at a time (workflow/rules/model-budget.md); xhigh+ only on request.
effort:
  cheap: low
  standard: medium
  reasoning: high
  frontier: medium

# Codex per-agent sandbox. Adapter picks: read_only agents -> read-only; agents with
# edit/shell capability -> workspace-write; others -> read-only. Never danger-full-access
# from the generator.
sandbox_default: read-only
