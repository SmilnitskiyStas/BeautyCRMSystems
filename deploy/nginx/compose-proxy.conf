# Контейнерний nginx (compose profile `proxy`): лише HTTP, для локальної перевірки / сервера без власного nginx.
# Монтується як /etc/nginx/conf.d/default.conf (http-контекст). Для TLS у проді див. beauty.conf (хостовий nginx).
upstream beauty_web { server web:3000; }
upstream beauty_api { server api:8080; }

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/beauty/beauty-locations.inc;
}
