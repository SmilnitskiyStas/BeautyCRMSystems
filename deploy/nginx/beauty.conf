# Хостовий nginx для beauty.agrusystems.pp.ua (reverse proxy на docker-стек із docker-compose.prod.yml).
#
# ВСТАНОВЛЕННЯ (на сервері, nginx уже обслуговує інший проєкт — цей файл його НЕ чіпає, бо весь вміст прив'язаний
# до server_name beauty.agrusystems.pp.ua, а імена upstream мають префікс beauty_):
#   1) sudo install -m 0644 beauty.conf            /etc/nginx/conf.d/beauty.conf        (або sites-available + symlink)
#   2) sudo install -m 0644 beauty-locations.inc   /etc/nginx/snippets/beauty-locations.inc
#      (шлях include нижче; якщо snippets/ немає — змініть шлях тут)
#   3) sudo install -d /var/www/beauty-wellknown && sudo install -m 0644 well-known/* /var/www/beauty-wellknown/
#      (спершу замініть плейсхолдери в apple-app-site-association / assetlinks.json реальними значеннями)
#   4) сертифікат (certbot): див. TLS нижче; потім  sudo nginx -t && sudo systemctl reload nginx
#
# ВІДКРИТІ ПИТАННЯ (не вгадуємо, треба підтвердити на сервері/в провайдера):
#  - Зовнішні порти: провайдер маппить на сервер нестандартні порти. Директиви `listen` нижче (80/443) відносяться до
#    портів, які слухає САМ nginx на хості; якщо 80/443 зайняті іншим проєктом/мапінгом — змініть їх (наприклад 8081/8443)
#    і узгодьте: Beauty__AllowedOrigins і NEXT_PUBLIC_API_URL у deploy/.env мають містити ЗОВНІШНІЙ порт, яким користуються
#    клієнти (https://beauty.agrusystems.pp.ua:<порт>), якщо він не 443. HTTP-01 для certbot потребує доступного ззовні порту 80
#    (або DNS-01).
#  - Редирект HTTP->HTTPS нижче не містить порту: при нестандартному зовнішньому HTTPS-порті замініть на
#    `return 301 https://$host:<зовнішній_порт>$request_uri;`.
#
# Порти upstream: 127.0.0.1:13000 (web) і 127.0.0.1:15080 (api) = WEB_HOST_PORT / API_HOST_PORT з deploy/.env.

upstream beauty_web { server 127.0.0.1:13000; keepalive 16; }
upstream beauty_api { server 127.0.0.1:15080; keepalive 16; }

# ---- HTTP: ACME-challenge + редирект на HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name beauty.agrusystems.pp.ua;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certbot --webroot -w /var/www/certbot
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (TLS-секція = ШАБЛОН) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beauty.agrusystems.pp.ua;
    server_tokens off;

    # Шляхи certbot за замовчуванням для ЦЬОГО домену (certbot certonly --webroot -d beauty.agrusystems.pp.ua).
    # Якщо сертифікати отримано інакше — підставте свої шляхи. Нічого з чужих сертифікатів не використовується.
    ssl_certificate     /etc/letsencrypt/live/beauty.agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty.agrusystems.pp.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BeautyTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Заголовки безпеки. Next.js і API самі ставлять CSP/X-Content-Type-Options/X-Frame-Options/Referrer-Policy;
    # тут лише HSTS (приховуємо upstream-версію, щоб не було дубля).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/beauty-locations.inc;
}
